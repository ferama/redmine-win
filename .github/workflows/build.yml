name: Build installer

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test the offline installer
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # PostgreSQL, Ruby, Redmine, MSYS2, wsw and Inno Setup archives. The key changes when the
      # pinned versions in the scripts change; restore-keys still reuse whatever is unchanged.
      - name: Cache downloads
        uses: actions/cache@v6
        with:
          path: installer/cache
          key: downloads-${{ hashFiles('Install-Redmine.ps1', 'installer/Build-Installer.ps1') }}
          restore-keys: downloads-

      # Runs as an elevated administrator on the hosted runner: creates temporary services
      # in C:\RedmineBuild, compiles the native gems with MSYS2 and packages the result
      - name: Build installer
        shell: pwsh
        run: ./installer/Build-Installer.ps1

      # Silent install with custom path/ports/language, service checks, uninstall keeping the
      # data, reinstall on the same data, full uninstall
      - name: Test installer
        shell: pwsh
        run: ./installer/Test-Installer.ps1

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem installer/dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            [IO.File]::WriteAllText("$($_.FullName).sha256", "$hash  $($_.Name)`n")
          }

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: redmine-setup
          path: installer/dist/*
          if-no-files-found: error

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs
          path: |
            installer/*.log
            C:/RedmineSetupTest*.log
            C:/RedmineSetupTest/logs/
            C:/RedmineBuild/logs/
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: redmine-setup
          path: dist

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
